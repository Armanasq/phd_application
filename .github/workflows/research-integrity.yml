name: Research integrity
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_sources.py
      - run: python3 scripts/detect_duplicates.py --fail-on-duplicates > /tmp/discovery_duplicates.json
      - run: python3 scripts/generate_index.py --check
      - run: python3 scripts/build_source_ledger.py --check
      - run: python3 scripts/check_links.py
      - run: python3 scripts/bootstrap.py --db .local/phd_intelligence.sqlite
